<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>짝 맞추기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#eaf2fc;color:#23324d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:900px;background:#fff;border-radius:24px;box-shadow:0 8px 30px rgba(40,70,120,.15);padding:24px 28px;position:relative}
h1{font-size:28px;text-align:center;color:#24407a}
.sub{text-align:center;color:#5a6b8c;margin-top:6px;font-size:16px}
.bar{height:12px;background:#e3ebf7;border-radius:6px;margin:18px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d7be0,#5bb48a);transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:#6b7a96}
.item{margin:18px auto 20px;max-width:520px;border:3px dashed #b9cbe8;border-radius:20px;padding:18px;text-align:center;background:#f7faff;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.item .ic{font-size:56px;line-height:1.1}
.item .nm{font-size:22px;font-weight:800;margin-top:8px}
.item .ds{font-size:15px;color:#6b7a96;margin-top:6px}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.bin{border:3px solid #d5e0f2;border-radius:18px;background:#fff;padding:12px 8px;cursor:pointer;text-align:center;transition:.15s;user-select:none}
.bin:hover{border-color:#3d7be0;transform:translateY(-3px);box-shadow:0 6px 14px rgba(61,123,224,.18)}
.bin img,.bin svg{width:84px;height:84px;image-rendering:auto;display:block;margin:0 auto}
.bin b{display:block;font-size:16px;margin-top:6px}
.bin small{display:block;font-size:12.5px;color:#7a88a3;margin-top:2px}
.bin.ok{border-color:#2e9a62;background:#ebf8f1}.bin.no{border-color:#d9534f;background:#fdeeee;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:16px;border-radius:16px;padding:14px 18px;font-size:16px;line-height:1.55;display:none}
.fb.ok{display:block;background:#ebf8f1;border:2px solid #9fd7b8;color:#1f6b45}
.fb.no{display:block;background:#fdeeee;border:2px solid #f0b4b2;color:#9b2f2b}
.btn{display:inline-block;margin-top:10px;background:#3d7be0;color:#fff;border:0;border-radius:24px;padding:10px 26px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:#2f66c2}
.center{text-align:center}
.start p{font-size:17px;line-height:1.7;margin:16px 0;color:#3a4a68}
.code{display:inline-block;margin:14px 0;font-size:40px;font-weight:900;letter-spacing:8px;color:#24407a;background:#eef4fd;border:3px solid #b9cbe8;border-radius:16px;padding:8px 26px}
.hide{display:none}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.card{height:112px;perspective:800px;cursor:pointer;user-select:none}
.card .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.card .f{background:linear-gradient(135deg,#3d7be0,#5b9bf0);color:#fff;font-size:34px;font-weight:900;border:3px solid #2f66c2}
.card .b{transform:rotateY(180deg);border:3px solid #d5e0f2;background:#fff}
.card .b .ic{font-size:30px;line-height:1.1}
.card .b .t{font-size:16px;font-weight:800;margin-top:4px;line-height:1.3}
.card .b .k{font-size:12px;color:#7a88a3;margin-top:2px}
.card.dz .b{background:#f3f7ff;border-color:#9dbbee}
.card.pc .b{background:#f1faf5;border-color:#9fd7b8}
.card.done .b{border-color:#2e9a62;box-shadow:0 0 0 3px #bfe8cf inset}
.card.bad .b{border-color:#d9534f;background:#fdeeee}
.legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:14px;color:#5a6b8c}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.legend .l1::before{background:#f3f7ff;border:2px solid #9dbbee}.legend .l2::before{background:#f1faf5;border:2px solid #9fd7b8}
@media(max-width:640px){.grid{grid-template-columns:repeat(3,1fr)}.card{height:104px}}
</style></head><body><div class="wrap">
<a href="index.html" style="position:absolute;left:20px;top:20px;color:#5a6b8c;text-decoration:none;font-size:15px">← 게임 고르기</a>
<h1>짝 맞추기</h1>
<div class="sub">카드 2장을 뒤집어 <b>질환·상황</b>과 알맞은 <b>격리주의·처리</b>를 짝지어 주세요!</div>

<div id="start" class="start center">
<p>카드 12장이 뒤집혀 있어요.<br>파란 카드는 <b>질환·상황</b>, 초록 카드는 <b>격리주의·처리</b>예요.<br>오늘 0~4번 병실에서 만난 환자들을 떠올려 보세요!</p>
<button class="btn" onclick="begin()">시작하기</button>
</div>

<div id="game" class="hide">
<div class="bar"><i id="prog"></i></div>
<div class="meta"><span id="cnt"></span><span id="err"></span></div>
<div class="legend"><span class="l1">질환·상황</span><span class="l2">격리주의·처리</span></div>
<div class="grid" id="grid"></div>
<div class="fb" id="fb"></div>
</div>

<div id="end" class="hide center">
<p style="font-size:22px;font-weight:800;margin-top:22px">짝 맞추기 완료! 오늘 근무 수고했어요.</p>
<p id="sum" style="margin-top:8px;color:#5a6b8c;font-size:17px"></p>
<p style="margin-top:14px;font-size:17px">퇴근 비밀번호</p>
<div class="code" id="code"></div>
<p style="color:#6b7a96;font-size:15px">ZEP으로 돌아가 출퇴근 기록기에 비밀번호를 입력하세요.</p>
<a class="btn" href="index.html" style="text-decoration:none;background:#7a88a3">다른 게임 고르기</a>
</div>
</div>
<script>
const PASSWORD="3824";
const PAIRS=[
 {a:{ic:"🫁",t:"폐결핵",k:"3번 병실"},b:{ic:"😷",t:"공기주의",k:"N95 · 음압병실"},why:"결핵은 공기로 퍼져요. N95를 쓰고 음압병실 문은 꼭 닫아요."},
 {a:{ic:"🤧",t:"인플루엔자 A",k:"2번 병실"},b:{ic:"💧",t:"비말주의",k:"수술용 마스크"},why:"인플루엔자는 비말로 퍼져요. 병실에 들어갈 때 수술용 마스크를 써요."},
 {a:{ic:"🦠",t:"CRE 양성",k:"1번 병실"},b:{ic:"🥼",t:"접촉주의",k:"가운 · 장갑"},why:"CRE는 손과 물건을 통해 퍼져요. 가운과 장갑을 쓰고 물품은 환자 전용으로 써요."},
 {a:{ic:"🩸",t:"B형간염",k:"4번 병실"},b:{ic:"⚠️",t:"혈액주의",k:"주사침 자상 주의"},why:"B형간염은 혈액으로 퍼져요. 일상 접촉으로는 옮지 않고, 혈액 노출과 주사침 자상에 주의해요."},
 {a:{ic:"🩹",t:"욕창 드레싱",k:"0번 · 배양 음성"},b:{ic:"🧤",t:"표준주의",k:"모든 환자 기본"},why:"격리가 필요 없는 환자도 표준주의는 늘 지켜요. 혈액·체액에 닿을 수 있으면 장갑을 써요."},
 {a:{ic:"💉",t:"쓰고 난 바늘",k:"채혈 직후"},b:{ic:"📦",t:"손상성폐기물",k:"사각 용기 · 즉시"},why:"사용한 바늘은 뚜껑을 다시 씌우지 말고 바로 손상성폐기물 용기에 버려요."}
];
let cards=[],first=null,lock=false,found=0,tries=0;
function shuffle(a){for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function begin(){
 cards=[];PAIRS.forEach((p,i)=>{cards.push({id:i,side:"dz",...p.a});cards.push({id:i,side:"pc",...p.b})});shuffle(cards);
 first=null;lock=false;found=0;tries=0;
 grid.innerHTML=cards.map((c,n)=>`<div class="card ${c.side}" data-n="${n}" onclick="flip(this)"><div class="in"><div class="f">?</div><div class="b"><div class="ic">${c.ic}</div><div class="t">${c.t}</div><div class="k">${c.k}</div></div></div></div>`).join("");
 start.classList.add("hide");game.classList.remove("hide");upd()}
function upd(){cnt.textContent=`찾은 짝 ${found} / ${PAIRS.length}`;err.textContent=`시도 ${tries}번`;prog.style.width=(found/PAIRS.length*100)+"%"}
function flip(el){
 if(lock||el.classList.contains("open")||el.classList.contains("done"))return;
 el.classList.add("open");
 if(!first){first=el;fb.className="fb";return}
 tries++;const a=cards[first.dataset.n],b=cards[el.dataset.n];const f=first;first=null;
 if(a.id===b.id&&a.side!==b.side){
  found++;f.classList.add("done");el.classList.add("done");f.classList.remove("open");el.classList.remove("open");
  fb.className="fb ok";fb.innerHTML=`<b>짝 찾음! ${a.side==="dz"?a.t:b.t} → ${a.side==="pc"?a.t:b.t}</b><br>${PAIRS[a.id].why}`;
  upd();if(found===PAIRS.length)setTimeout(finish,1600);
 }else{
  lock=true;upd();
  fb.className="fb no";fb.innerHTML=a.side===b.side?`<b>같은 색 카드끼리는 짝이 아니에요.</b><br>파란 카드(질환·상황) 하나와 초록 카드(격리주의·처리) 하나를 골라요.`:`<b>짝이 아니에요.</b><br>어떤 경로로 퍼지는지 떠올려 보세요. 카드 위치를 기억해 두세요!`;
  setTimeout(()=>{f.classList.add("bad");el.classList.add("bad")},350);
  setTimeout(()=>{f.classList.remove("open","bad");el.classList.remove("open","bad");lock=false},1300);
 }}
function finish(){game.classList.add("hide");end.classList.remove("hide");
 sum.textContent=`${tries}번 만에 6쌍을 모두 찾았어요!`;code.textContent=PASSWORD}
</script></body></html>
